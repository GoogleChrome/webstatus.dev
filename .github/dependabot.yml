  # =========================================================================
  # Other Ecosystems (06:00 AM PST)
  # =========================================================================

  # NPM
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@types/node'
        versions:
          - '>=23'
          - '<24'
          - '>=25'
          - '<26'

  # Docker
  - package-ecosystem: 'docker'
    directory: '/.dev/datastore'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/.dev/gcs'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    cooldown:
