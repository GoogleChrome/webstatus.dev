version: 2
updates:
  # =========================================================================
  # Go Modules (Configured per Module Directory with Staggered Monday Run Times)
  # =========================================================================

  # Core Libraries & Shared Generators (02:00 AM PST)
  - package-ecosystem: 'gomod'
    directory: '/lib'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: 'github.com/GoogleChrome/webstatus.dev/*'
    groups:
      go_modules:
        patterns:
          - '*'

  - package-ecosystem: 'gomod'
    directory: '/lib/gen'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: 'github.com/GoogleChrome/webstatus.dev/*'
    groups:
      go_modules:
        patterns:
          - '*'

  - package-ecosystem: 'gomod'
    directory: '/util'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: 'github.com/GoogleChrome/webstatus.dev/*'
    groups:
      go_modules:
        patterns:
          - '*'

  - package-ecosystem: 'gomod'
