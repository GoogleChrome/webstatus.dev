name: Dev Container Image Build
on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 0 * * 2' # Runs every Tuesday at midnight UTC
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'images/**'
      - '.dev/**'

permissions:
  contents: read
  packages: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  GO_CACHE_DEPENDENCY_PATH: '**/*.sum'

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-build dev container base image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: always

  # Run the precommit action to build language/tool specific caches
  # The precommit action currently is configured to cache:
  # - Go packages
  # - Node packages
  warm-up-precommit-action:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          # Lower reserve to 2GB just for OS overhead; Docker moves to the big partition below
          root-reserve-mb: 2048
          overprovision-lvm: 'true'
          build-mount-path: '/home/runner/work/webstatus.dev'
        continue-on-error: true
      #  Create the folder structure on the new disk
      #  We need to recreate the repo folder because the mount starts empty.
      - name: Create Workspace
        run: mkdir -p ${{ github.workspace }}
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move Docker
        run: |
          sudo service docker stop
          mkdir -p ../docker-storage
          sudo rm -rf /var/lib/docker
          sudo ln -s $(realpath ../docker-storage) /var/lib/docker
          sudo service docker start
      - name: check storage
        run: |
          sudo df -h
          echo "Docker Root Dir:"
          sudo docker info | grep "Docker Root Dir"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run precommit target for CI
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: never
          runCmd: make precommit

  # Currently, this action does not cache anything.
  # However, we should run it as a sanity check to make sure the devcontainer
  # is not broken.
  test-playwright-action:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          # Lower reserve to 2GB just for OS overhead; Docker moves to the big partition below
          root-reserve-mb: 2048
          overprovision-lvm: 'true'
          build-mount-path: '/home/runner/work/webstatus.dev'
        continue-on-error: true
      #  Create the folder structure on the new disk
      #  We need to recreate the repo folder because the mount starts empty.
      - name: Create Workspace
        run: mkdir -p ${{ github.workspace }}
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move Docker
        run: |
          sudo service docker stop
          mkdir -p ../docker-storage
          sudo rm -rf /var/lib/docker
          sudo ln -s $(realpath ../docker-storage) /var/lib/docker
          sudo service docker start
      - name: check storage
        run: |
          sudo df -h
          echo "Docker Root Dir:"
          sudo docker info | grep "Docker Root Dir"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run playwright-test target for CI
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: never
          runCmd: CI=true make playwright-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build-service-images:
    runs-on: ubuntu-latest
    needs: build-base-image
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: .
            dockerfile: images/nodejs_service.Dockerfile
            args: service_dir=frontend
          - name: backend
            context: .
            dockerfile: images/go_service.Dockerfile
            args: service_dir=backend
          - name: spanner
            context: .
            dockerfile: .dev/spanner/Dockerfile
            args: ''
          - name: datastore
            context: .dev/datastore
            dockerfile: .dev/datastore/Dockerfile
            args: ''
          - name: auth
            context: .dev/auth
            dockerfile: .dev/auth/Dockerfile
            args: ''
          - name: wiremock
            context: .dev/wiremock
            dockerfile: .dev/wiremock/Dockerfile
            args: ''
          - name: valkey
            context: .dev/valkey
            dockerfile: .dev/valkey/Dockerfile
            args: ''
          - name: pubsub
            context: .
            dockerfile: .dev/pubsub/Dockerfile
            args: ''
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code inside DevContainer for services
        if: matrix.service.name == 'backend' || matrix.service.name == 'frontend'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: never
          runCmd: make gen
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Pre-build ${{ matrix.service.name }} service image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: ${{ matrix.service.args }}
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/webstatus.dev/${{ matrix.service.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_OWNER }}/webstatus.dev/${{ matrix.service.name }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_OWNER }}/webstatus.dev/${{ matrix.service.name }}:cache,mode=max
