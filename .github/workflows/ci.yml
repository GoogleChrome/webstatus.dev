name: 'build'
on: # trigger builds for 1) PRs, 2) merges into main from merge_queue, and 3) manual runs.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  GO_CACHE_DEPENDENCY_PATH: '**/*.sum'
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Cache DevContainer Dependencies (Go, Node, Playwright)
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            .devcontainer/cache/go/go-build
            .devcontainer/cache/go/pkg
            .devcontainer/cache/node/.npm
            .devcontainer/cache/playwright
          key: ${{ runner.os }}-devcontainer-precommit-${{ hashFiles('**/*.sum') }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.devcontainer/devcontainer.json') }}
          restore-keys: |
            ${{ runner.os }}-devcontainer-precommit-${{ hashFiles('**/*.sum') }}-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-devcontainer-precommit-${{ hashFiles('**/*.sum') }}-
            ${{ runner.os }}-devcontainer-precommit-
            ${{ runner.os }}-devcontainer-
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run precommit target for CI
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
        with:
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: never
          runCmd: |
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            export REPO_OWNER="${{ env.REPO_OWNER }}"
            make precommit
  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast visual tests (static fixtures, ~1 min)
          - suite: visual
            project: chromium
            shard: ''
            shard-suffix: ''
          - suite: visual
            project: firefox
            shard: ''
            shard-suffix: ''
          - suite: visual
            project: webkit
            shard: ''
            shard-suffix: ''
          # Synthetic smoke probes (lightweight end-to-end cluster health, ~15s test run)
          - suite: synthetic
            project: chromium
            shard: ''
            shard-suffix: ''
          - suite: synthetic
            project: firefox
            shard: ''
            shard-suffix: ''
          - suite: synthetic
            project: webkit
            shard: ''
            shard-suffix: ''
          # Stateful functional tests (sharded 1/3, 2/3, 3/3)
          - suite: functional
            project: chromium
            shard: '1/3'
            shard-suffix: '-1-3'
          - suite: functional
            project: chromium
            shard: '2/3'
            shard-suffix: '-2-3'
          - suite: functional
            project: chromium
            shard: '3/3'
            shard-suffix: '-3-3'
          - suite: functional
            project: firefox
            shard: '1/3'
            shard-suffix: '-1-3'
          - suite: functional
            project: firefox
            shard: '2/3'
            shard-suffix: '-2-3'
          - suite: functional
            project: firefox
            shard: '3/3'
            shard-suffix: '-3-3'
          - suite: functional
            project: webkit
            shard: '1/3'
            shard-suffix: '-1-3'
          - suite: functional
            project: webkit
            shard: '2/3'
            shard-suffix: '-2-3'
          - suite: functional
            project: webkit
            shard: '3/3'
            shard-suffix: '-3-3'
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV
      - name: Cache DevContainer Dependencies (Go, Node, Playwright)
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            .devcontainer/cache/go/go-build
            .devcontainer/cache/go/pkg
            .devcontainer/cache/node/.npm
            .devcontainer/cache/playwright
          key: ${{ runner.os }}-devcontainer-playwright-${{ hashFiles('**/*.sum') }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.devcontainer/devcontainer.json') }}
          restore-keys: |
            ${{ runner.os }}-devcontainer-playwright-${{ hashFiles('**/*.sum') }}-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-devcontainer-playwright-${{ hashFiles('**/*.sum') }}-
            ${{ runner.os }}-devcontainer-playwright-
            ${{ runner.os }}-devcontainer-precommit-
            ${{ runner.os }}-devcontainer-
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run playwright target for CI
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
        with:
          cacheFrom: ghcr.io/${{ env.REPO_OWNER }}/webstatus-dev-devcontainer
          push: never
          runCmd: |
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            export REPO_OWNER="${{ env.REPO_OWNER }}"
            CI=true make playwright-${{ matrix.suite }} PLAYWRIGHT_PROJECT=${{ matrix.project }} PLAYWRIGHT_SHARD=${{ matrix.shard }}
      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.suite }}-${{ matrix.project }}${{ matrix.shard-suffix }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download all blob reports
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into unified HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload unified HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
